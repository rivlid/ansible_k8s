---
- name: Deploy Calico network plugin
  ansible.builtin.shell:
    cmd: kubectl apply --server=https://{{ hostvars[groups['masters'][0]]['ansible_host'] }}:{{ apiserver_port }} --insecure-skip-tls-verify -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.0/manifests/calico.yaml
  when: inventory_hostname == groups['masters'][0]