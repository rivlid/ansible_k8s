---
- name: Template democratic-csi config (namespace + driver secret)
  ansible.builtin.template:
    src: democratic-csi-config.yaml
    dest: /tmp/democratic-csi-config.yaml
    mode: "0600"
  register: dcsi_config

- name: Apply democratic-csi config
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/democratic-csi-config.yaml

- name: Remove config with API key from /tmp
  ansible.builtin.file:
    path: /tmp/democratic-csi-config.yaml
    state: absent

- name: Copy democratic-csi manifest
  ansible.builtin.copy:
    src: democratic-csi.yaml
    dest: /tmp/democratic-csi.yaml

- name: Apply democratic-csi manifest
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/democratic-csi.yaml

- name: Restart controller and node if driver config changed
  ansible.builtin.command:
    cmd: "kubectl -n {{ democratic_csi_namespace }} rollout restart {{ item }}"
  loop:
    - deployment/truenas-iscsi-democratic-csi-controller
    - daemonset/truenas-iscsi-democratic-csi-node
  when: dcsi_config.changed

- name: Wait for democratic-csi controller ready
  ansible.builtin.command:
    cmd: "kubectl -n {{ democratic_csi_namespace }} rollout status deployment/truenas-iscsi-democratic-csi-controller --timeout=180s"

- name: Wait for democratic-csi node ready
  ansible.builtin.command:
    cmd: "kubectl -n {{ democratic_csi_namespace }} rollout status daemonset/truenas-iscsi-democratic-csi-node --timeout=300s"
