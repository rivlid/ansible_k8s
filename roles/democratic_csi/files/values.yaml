# helm values для democratic-csi (chart 0.15.1, драйвер v1.9.5).
# democratic-csi.yaml в этой папке получен так (на машине с helm и интернетом):
#   helm repo add democratic-csi https://democratic-csi.github.io/charts/
#   helm template truenas-iscsi democratic-csi/democratic-csi --version 0.15.1 \
#     -n democratic-csi -f values.yaml > democratic-csi.yaml
csiDriver:
  name: "org.democratic-csi.truenas-iscsi"

storageClasses:
  - name: truenas-iscsi
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    parameters:
      fsType: ext4
      detachedVolumesFromSnapshots: "false"
    mountOptions: []
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:

volumeSnapshotClasses: []

driver:
  existingConfigSecret: truenas-iscsi-driver-config
  config:
    driver: freenas-api-iscsi

controller:
  driver:
    image:
      tag: v1.9.5

node:
  driver:
    image:
      tag: v1.9.5
