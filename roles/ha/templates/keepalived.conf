global_defs {
    enable_script_security
    script_user nobody
}
vrrp_script check_apiserver {
  script "/etc/keepalived/check_apiserver.sh"
  interval 3
}
vrrp_instance VI_1 {
    state BACKUP
    interface {{ ansible_default_ipv4.interface }}
    virtual_router_id {{ keepalived_router_id }}
    priority {{ 101 - groups['masters'].index(inventory_hostname) }}
    advert_int 1
    nopreempt
    authentication {
        auth_type PASS
        auth_pass {{ keepalived_auth_pass }}
    }
    virtual_ipaddress {
        {{ vip }}
    }
    track_script {
        check_apiserver
    }
}